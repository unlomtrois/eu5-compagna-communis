l_english:
 compagna_communis_io: "Compagna Communis Ianuensis"
 compagna_communis_io_desc: "At the end of the 11th century, the trade associations of [GetCountry('GEN').GetName] and the noble lords of the surrounding valleys and coasts came together to form a communal government — the Compagna Communis. More than a mere city-state, it is a federation of merchants, bankers, and seafarers bound by shared interest and mutual profit, projecting [GetCountry('GEN').GetAdjective] power across the Mediterranean Sea and beyond" 
 diplomatic_status_compagna_communis_io_name: "Compagna Communis Ianuensis"
 diplomatic_status_compagna_communis_io_tooltip: "#T Compagna Communis Ianuensis#!\nThis country is a member of the Compagna Communis Ianuensis."
 compagna_communis_io_list_who_tt: "$WHO$ is in the Compagna Communis Ianuensis with $LIST$"
 cc_core_member: "Superba"
 cc_core_member_desc: "The seat of the [GetUniqueInternationalOrganization('compagna_communis_io').GetName] and heart of [GetCountry('GEN').GetAdjective] power. As the founding [member|e], the Superba holds full voting rights in the [GetUniqueInternationalOrganization('compagna_communis').GetParliament.GetName], can propose [policies|e], and receives a baseline bonus to its influence within the organization. The Compagna endures only as long as the Superba stands."
 cc_trade_office: "Officium Gazariae"
 cc_trade_office_desc: "The Officium Gazariae oversees [GetCountry('GEN').GetAdjective] commercial interests across the [ShowAreaName('black_sea_area')], operating from the great fortress of Caffa in [ShowAreaName('crimea_area')]. It may hold land as a governor on behalf of [GetCountry('GEN').GetName], or exist as an extraterritorial body — owning only trade buildings and warehouses across the ports of the [ShowAreaName('black_sea_area')]. Countries along the [ShowAreaName('black_sea_area')] coast will find [GetCountry('GEN').GetAdjective] merchants a persistent presence in their ports."
 cc_state_bank: "Banco di San Giorgio"
 cc_state_bank_desc: "Born from the crushing weight of [GetCountry('GEN').GetName]'s accumulated debts, the Banco di San Giorgio consolidates the republic's obligations under a single institution empowered to manage public finances. The Bank may purchase expired [ShowSubjectTypeName('maona_charter')]s, turning them into its own clients — and should its influence within the Compagna surpass that of the [ShowSpecialStatusName('cc_core_member')] itself, it may rise to lead the organization from the shadows."
 cc_maona: "Maona"
 cc_maona_desc: "A chartered consortium of private investors granted administration over a territory for a fixed term. A Maona transfers the bulk of its [merchant_power|e] to the leader of the Compagna, while its shareholders collect a share of local trade revenues. When the charter expires, the [ShowSpecialStatusName('cc_core_member')] must choose: redeem the territory, extend the charter at a cost to [prestige|e] and [estate|e] [loyalty|e], or sell it to the [ShowSpecialStatusName('cc_state_bank')]."
 COMPAGNA_LEADER: "Primatus Compagnae"
 SEAT_OF_THE_COMPAGNA: "Seat of Compagna"
 
 communal_unity: "Communal unity"
 communal_unity_desc: "It is a measure of the internal cohesion of the [GetUniqueInternationalOrganization('compagna_communis_io').GetName], reflecting how well its members cooperate under shared governance.\n\nHigh $communal_unity$ affects the following things:\n$BULLET$ Increases [ShowModifierTypeName('trade_efficiency')] and [ShowModifierTypeName('naval_morale')] for all [members|e] of the [GetUniqueInternationalOrganization('compagna_communis_io').GetName].\n$BULLET$ [members|e] are more likely to vote for [policies|e] proposed by the leader in the [GetUniqueInternationalOrganization('compagna_communis_io').GetParliament.GetName].\n\nLow $communal_unity$ affects the following things:\n$BULLET$ Reduces [ShowModifierTypeName('trade_efficiency')] for the [GetUniqueInternationalOrganization('compagna_communis_io').GetName].\n$BULLET$ [members|e] may declare war on each other if $communal_unity$ falls below $ICON_NUMBER_20$.\n$BULLET$ The [GetUniqueInternationalOrganization('compagna_communis').GetName] risks dissolution if $communal_unity$ falls below $ICON_NUMBER_10$."
 
 LEAD_maona: "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_maona: "[SUBJECT_TYPE.GetName] of $LIST$."