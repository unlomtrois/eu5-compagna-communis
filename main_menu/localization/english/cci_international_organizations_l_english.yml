 communal_unity: "Communal unity"
 communal_unity_desc: "It is a measure of the internal cohesion of the [GetUniqueInternationalOrganization('compagna_communis_io').GetName], reflecting how well its members cooperate under shared governance.\n\nHigh $communal_unity$ affects the following things:\n$BULLET$ Increases [ShowModifierTypeName('trade_efficiency')] and [ShowModifierTypeName('naval_morale')] for all [members|e] of the [GetUniqueInternationalOrganization('compagna_communis_io').GetName].\n$BULLET$ [members|e] are more likely to vote for [policies|e] proposed by the leader in the [GetUniqueInternationalOrganization('compagna_communis_io').GetParliament.GetName].\n\nLow $communal_unity$ affects the following things:\n$BULLET$ Reduces [ShowModifierTypeName('trade_efficiency')] for the [GetUniqueInternationalOrganization('compagna_communis_io').GetName].\n$BULLET$ [members|e] may declare war on each other if $communal_unity$ falls below $ICON_NUMBER_20$.\n$BULLET$ The [GetUniqueInternationalOrganization('compagna_communis').GetName] risks dissolution if $communal_unity$ falls below $ICON_NUMBER_10$."
 
