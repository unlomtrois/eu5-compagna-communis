l_english:
  maona_advance: "Maona"
  maona_advance_desc: "Born from necessity and merchant ingenuity, the Maona is a form of association whereby private investors band together to finance costly ventures on behalf of the state, receiving in return the right to administer and profit from the conquered or leased territories. First devised to fund naval expeditions that $GEN$ could not afford alone, this institution allows our republic to project power far beyond what our treasury would otherwise permit — at the price of sharing sovereignty with those who hold the purse strings."
